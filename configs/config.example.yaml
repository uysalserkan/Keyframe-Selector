# Keyframe Selection Pipeline Configuration
# ==========================================
# This file documents all available hyperparameters (H1-H10)
# Copy this file and modify as needed for your experiments.
#
# IMPORTANT: Default values are optimized for RECONSTRUCTION QUALITY (PSNR/L1).
# For video summarization (diversity), use lower beta, k_max, and method: dpp.
# See PSNR_L1_ANALYSIS.md for detailed recommendations.

# Input settings
video_path: null  # Path to video file (use this OR frame_dir)
frame_dir: ./frames  # Path to pre-extracted frames directory

# Output settings
output_dir: ./output
save_intermediate: false  # Save embeddings, kernels for analysis

# Encoder Backend Selection
# Options: "clip" (OpenAI CLIP) or "dinov3" (Meta DINOv2/v3 via Hugging Face)
encoder_backend: clip

# Frame Sampling (H2)
# NOTE: fps=1.0 is too sparse for good reconstruction. Use 2.0-5.0 for better PSNR.
frame_sampling:
  fps: 2.0  # Frames per second to sample (CHANGED: was 1.0, too sparse)
  adaptive: false  # Enable scene-change based sampling
  adaptive_threshold: 30.0
  output_format: jpg
  jpeg_quality: 95

# CLIP Encoder (H1, H4) - used when encoder_backend: clip
clip_encoder:
  model_name: "ViT-L/14"  # H1: CLIP model variant
  # Options: ViT-B/32, ViT-B/16, ViT-L/14, ViT-L/14@336px
  temporal_weight: 0.1  # H4: Temporal encoding weight α
  batch_size: 32
  use_fp16: true  # Mixed precision (faster on GPU)
  device: null  # null = auto-detect

# DINOv3 Encoder (H1, H4) - used when encoder_backend: dinov3
dinov3_encoder:
  model_id: "facebook/dinov2-base"  # H1: DINOv2/v3 model from Hugging Face
  # Options: facebook/dinov2-small, facebook/dinov2-base, facebook/dinov2-large, facebook/dinov2-giant
  revision: null  # Model revision for reproducibility (null = latest)
  temporal_weight: 0.1  # H4: Temporal encoding weight α
  pooling: cls  # Options: cls (CLS token), mean (mean of patches)
  batch_size: 32
  use_fp16: true  # Mixed precision (faster on GPU)
  device: null  # null = auto-detect

# Temporal Analysis (H3)
temporal_analysis:
  delta_percentile: 90.0  # H3: Percentile for change threshold τΔ
  use_ema_smoothing: false  # Smooth noisy deltas
  ema_alpha: 0.3
  min_segment_frames: 3  # Minimum gap between change points
  use_gpu: true  # GPU acceleration for temporal gradient computation

# Entropy-based K Estimation (H5, H6)
# NOTE: Original defaults (beta=1.0, k_max=50) produce too few keyframes for reconstruction.
# Formula: K = beta * sqrt(N) * entropy * (1 + mean_delta)
# For N=600, entropy=0.5: beta=1.0 gives K~15, beta=2.5 gives K~37
entropy_estimator:
  num_bins: 50  # H5: Histogram bins for entropy
  beta: 2.5  # H6: Scaling factor β for K (CHANGED: was 1.0, too conservative)
  pca_components: 32  # Dimensionality reduction
  k_min: 10  # Minimum keyframes (CHANGED: was 3, too few for reconstruction)
  k_max: 300  # Maximum keyframes (CHANGED: was 50, too restrictive)
  epsilon: 1.0e-10
  use_gpu: true  # GPU acceleration for PCA dimensionality reduction

# DPP Kernel (H7, H8)
dpp_kernel:
  sigma_f: null  # H7: Feature bandwidth (null = median heuristic)
  sigma_t_ratio: 0.2  # H8: Temporal bandwidth as fraction of duration
  combine_method: hadamard  # Options: hadamard, additive
  use_gpu: true

# Selector (H9)
# NOTE: For reconstruction quality, kmeans is better than dpp.
# DPP optimizes for DIVERSITY, kmeans selects REPRESENTATIVE frames (medoids).
selector:
  method: kmeans  # Options: dpp, kmeans, hdbscan (CHANGED: was dpp, kmeans better for PSNR)
  
  # DPP-specific (only used when method: dpp)
  mode: map  # H9: DPP mode (CHANGED: was sample, map is deterministic/reproducible)
  fixed_k: null  # Override adaptive K (null = use entropy-based)
  seed: 42
  num_samples: 1
  min_frame_gap: 3  # (CHANGED: was 5, allow closer keyframes for reconstruction)
  include_change_points: true
  
  # K-means specific (only used when method: kmeans)
  kmeans_init: k-means++  # Options: k-means++, random
  kmeans_n_init: 10
  kmeans_max_iter: 300
  kmeans_use_gpu: true  # GPU acceleration for K-means clustering
  
  # HDBSCAN specific (only used when method: hdbscan)
  hdbscan_min_cluster_size: 2
  hdbscan_min_samples: null  # null = same as min_cluster_size
  hdbscan_cluster_selection_epsilon: 0.0
  hdbscan_cluster_selection_method: eom  # Options: eom, leaf
  
  # DPP GPU acceleration
  dpp_use_gpu: true  # GPU acceleration for DPP greedy MAP inference

# Motion Awareness (H10)
motion:
  enabled: false  # Enable optical flow features
  gamma: 0.1  # H10: Motion encoding weight γ
  method: farneback  # Options: farneback, raft
  flow_scale: 0.5  # Downscale for faster computation

# Ablation Toggles
use_temporal_encoding: true  # Enable/disable H4
use_entropy_k: true  # Enable/disable adaptive K
use_temporal_kernel: true  # Enable/disable temporal DPP kernel

# Global Settings
random_seed: 42
verbose: true
