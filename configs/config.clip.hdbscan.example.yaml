# Keyframe Selection Pipeline Configuration - CLIP + HDBSCAN
# ===========================================================
# This example uses OpenAI CLIP with HDBSCAN density-based clustering.
# HDBSCAN automatically determines the number of clusters.
#
# NOTE: HDBSCAN may produce variable K based on density. For controlled K,
# consider using kmeans instead. See PSNR_L1_ANALYSIS.md.

# Input settings
video_path: "/Users/serkan.uysal/Downloads/3d-spin-videos/case.mp4"   # Path to video file (use this OR frame_dir)
frame_dir: null # Path to pre-extracted frames directory

# Output settings
output_dir: ./output_clip_case_hdbscan
save_intermediate: false  # Save embeddings, kernels for analysis

# Encoder Backend Selection
encoder_backend: clip

# Frame Sampling (H2)
frame_sampling:
  fps: 5.0  # Frames per second to sample
  adaptive: true  # Enable scene-change based sampling
  adaptive_threshold: 30.0
  output_format: jpg
  jpeg_quality: 95

# DINOv3 Encoder Configuration
dinov3_encoder:
  # Model ID from Hugging Face Hub
  # Available options:
  #   - facebook/dinov2-small  (384 dim, fastest)
  #   - facebook/dinov2-base   (768 dim, balanced)
  #   - facebook/dinov2-large  (1024 dim, higher quality)
  #   - facebook/dinov2-giant  (1536 dim, best quality, slowest)
  model_id: "facebook/dinov2-large"
  
  # Model revision for reproducibility (null = latest)
  revision: null
  
  # H4: Temporal encoding weight α
  temporal_weight: 0.1
  
  # Pooling strategy for feature extraction
  # Options:
  #   - cls: Use CLS token (recommended for DINOv2)
  #   - mean: Mean pool over patch tokens
  pooling: cls
  
  # Processing settings
  batch_size: 32
  use_fp16: true  # Mixed precision (faster on GPU)
  device: null  # null = auto-detect (cuda if available)

# CLIP Encoder (not used when encoder_backend: dinov3, but kept for reference)
clip_encoder:
  model_name: "ViT-L/14"
  temporal_weight: 0.1
  batch_size: 32
  use_fp16: true
  device: null

# Temporal Analysis (H3)
temporal_analysis:
  delta_percentile: 90.0  # H3: Percentile for change threshold τΔ
  use_ema_smoothing: false  # Smooth noisy deltas
  ema_alpha: 0.3
  min_segment_frames: 3  # Minimum gap between change points
  use_gpu: true  # GPU acceleration for temporal gradient computation

# Entropy-based K Estimation (H5, H6)
# NOTE: HDBSCAN ignores K estimation (auto-determines clusters)
# These settings are kept for reference if switching to kmeans/dpp
entropy_estimator:
  num_bins: 50  # H5: Histogram bins for entropy
  beta: 2.5  # H6: Scaling factor β for K (was 1.0)
  pca_components: 32  # Dimensionality reduction
  k_min: 10  # Minimum keyframes (was 3)
  k_max: 300  # Maximum keyframes (was 50)
  epsilon: 1.0e-10
  use_gpu: true  # GPU acceleration for PCA dimensionality reduction

# DPP Kernel (H7, H8)
dpp_kernel:
  sigma_f: null  # H7: Feature bandwidth (null = median heuristic)
  sigma_t_ratio: 0.2  # H8: Temporal bandwidth as fraction of duration
  combine_method: hadamard  # Options: hadamard, additive
  use_gpu: true

# Selector (H9)
# HDBSCAN auto-determines number of clusters based on density
# For better reconstruction: lower min_cluster_size = more clusters = more keyframes
selector:
  method: hdbscan  # Options: dpp, kmeans, hdbscan
  
  # DPP-specific (only used when method: dpp)
  mode: map  # H9: DPP mode (was sample)
  fixed_k: null  # Override adaptive K (null = use entropy-based)
  seed: 42
  num_samples: 1
  min_frame_gap: 2  # was 5, allow closer keyframes
  include_change_points: true
  
  # K-means specific (only used when method: kmeans)
  kmeans_init: k-means++  # Options: k-means++, random
  kmeans_n_init: 10
  kmeans_max_iter: 300
  kmeans_use_gpu: true  # GPU acceleration for K-means clustering
  
  # HDBSCAN specific (only used when method: hdbscan)
  # Lower min_cluster_size = more clusters = more keyframes = better reconstruction
  hdbscan_min_cluster_size: 2  # Minimum cluster size (smaller = more clusters)
  hdbscan_min_samples: 1  # was null, lower = more keyframes
  hdbscan_cluster_selection_epsilon: 0.0
  hdbscan_cluster_selection_method: leaf  # was eom, leaf gives more clusters
  
  # DPP GPU acceleration
  dpp_use_gpu: true  # GPU acceleration for DPP greedy MAP inference

# Motion Awareness (H10)
motion:
  enabled: true  # Enable optical flow features
  gamma: 0.1  # H10: Motion encoding weight γ
  method: farneback  # Options: farneback, raft
  flow_scale: 0.5  # Downscale for faster computation

# Ablation Toggles
use_temporal_encoding: true  # Enable/disable H4
use_entropy_k: true  # Enable/disable adaptive K
use_temporal_kernel: true  # Enable/disable temporal DPP kernel

# Global Settings
random_seed: 42
verbose: true
